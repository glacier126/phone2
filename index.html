<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>iPhone</title>
<style>
:root{
  --ease:cubic-bezier(.32,.72,0,1);
  --blue:#007aff;--red:#ff3b30;--green:#34c759;
  --sep:rgba(60,60,67,.29);--grey:#8e8e93;--bg2:#f2f2f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.2px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
svg{display:block}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#2a2a30,#0b0b0d 70%)}
#phone{position:relative;width:393px;aspect-ratio:393/852;border-radius:58px;background:#000;overflow:hidden;isolation:isolate;box-shadow:0 0 0 10px #121214,0 0 0 12px #3b3b40,0 0 0 13px #18181a,0 40px 90px rgba(0,0,0,.8)}
@media (max-width:440px),(max-height:900px){body{background:#000}#phone{width:100vw;height:100dvh;aspect-ratio:auto;border-radius:0;box-shadow:none}}
#screen{position:absolute;inset:0;overflow:hidden}
#wall{position:absolute;inset:-2px;z-index:0;background:radial-gradient(ellipse 80% 55% at 12% 8%,rgba(126,116,255,.72),transparent 62%),radial-gradient(ellipse 65% 50% at 88% 18%,rgba(255,110,190,.55),transparent 60%),radial-gradient(ellipse 90% 65% at 72% 98%,rgba(52,140,255,.5),transparent 66%),linear-gradient(168deg,#2b3055 0%,#171a33 52%,#0a0c18 100%);transition:filter .45s,transform .45s}
#wall.dim{filter:blur(24px) brightness(.62);transform:scale(1.08)}
.layer{position:absolute;inset:0}
#homeL,#appL{visibility:hidden}
#appL{z-index:20;background:#fff;overflow:hidden}
#ov{position:absolute;inset:0;z-index:60;pointer-events:none}
#ov>*{pointer-events:auto}
#sb{position:absolute;z-index:80;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 44px;pointer-events:none;color:#000;transition:color .3s}
#sb.light{color:#fff}
#sb .t{font-size:17px;font-weight:600;letter-spacing:-.3px;width:60px;text-align:center;font-variant-numeric:tabular-nums}
#sb .r{display:flex;gap:6px;align-items:center}
#sb svg{fill:currentColor}
#sbk{display:none;position:absolute;left:22px;top:6px;height:48px;min-width:92px;padding:0 6px;align-items:center;gap:3px;font-size:14px;font-weight:600;color:inherit;pointer-events:auto;cursor:pointer;white-space:nowrap}
#sbk svg{width:7px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#sb.crumb #sbk{display:flex}
#sb.crumb .t{visibility:hidden}
#island{position:absolute;z-index:90;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px;transition:width .5s var(--ease)}
#island.act{width:200px}
#hb{position:absolute;z-index:85;bottom:0;left:0;right:0;height:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;cursor:pointer;touch-action:none}
#hb i{width:139px;height:5px;border-radius:3px;background:#000;transition:background .3s,transform .2s}
#hb.light i{background:#fff}
#lockL{z-index:30;color:#fff;touch-action:none}
.lk-date{position:absolute;top:84px;width:100%;text-align:center;font-size:21px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.lk-time{position:absolute;top:104px;width:100%;text-align:center;font-size:104px;font-weight:600;letter-spacing:-3px;line-height:1.1;text-shadow:0 2px 20px rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
.lk-notes{position:absolute;left:9px;right:9px;bottom:132px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 260px);overflow:hidden}
.ncard{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:22px;background:rgba(240,240,245,.55);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);color:#111;text-align:left;width:100%}
.ncard .ni{width:38px;height:38px;border-radius:9px;flex:none;display:grid;place-items:center;overflow:hidden}
.ncard .ni svg{width:100%;height:100%}
.ncard .nt{flex:1;min-width:0}
.ncard .nh{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.ncard .nh small{font-weight:400;color:rgba(0,0,0,.5);font-size:13px}
.ncard .nb{font-size:15px;line-height:1.3;margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.lk-btn{position:absolute;bottom:46px;width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;place-items:center;transition:transform .15s,background .2s}
.lk-btn:active{transform:scale(1.15);background:rgba(255,255,255,.4)}
.lk-btn svg{width:24px;height:24px;fill:#fff}
.lk-hint{position:absolute;bottom:42px;width:100%;text-align:center;font-size:14px;font-weight:500;opacity:.85;animation:hint 2.4s ease-in-out infinite;pointer-events:none}
@keyframes hint{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.85;transform:translateY(-4px)}}
#pinL{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;color:#fff;padding-top:118px}
#pinL.act{display:flex}
.pin-title{font-size:20px;font-weight:500}
.pdots{display:flex;gap:22px;margin:22px 0 40px}
.pdots i{width:13px;height:13px;border-radius:50%;border:1.4px solid #fff;transition:background .1s}
.pdots i.on{background:#fff}
.pdots.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.pkeys{display:grid;grid-template-columns:repeat(3,78px);gap:15px 25px}
.pk{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .35s}
.pk.dn{background:rgba(255,255,255,.55);transition:none}
.pk b{font-size:36px;font-weight:400;line-height:1}
.pk small{font-size:10px;font-weight:700;letter-spacing:2px;margin-top:2px;min-height:12px}
.pbot{position:absolute;bottom:48px;left:46px;right:46px;display:flex;justify-content:space-between;font-size:16px}
#homeL{z-index:10;transform-origin:50% 50%}
.hgrid{position:absolute;top:68px;left:20px;right:20px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:24px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;width:74px;transition:transform .15s,filter .15s}
.app:active{transform:scale(.9);filter:brightness(.8)}
.icon{position:relative;width:62px;height:62px;border-radius:14.5px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.icon .ic{width:100%;height:100%;border-radius:inherit;overflow:hidden}
.icon .ic svg{width:100%;height:100%}
.lbl{color:#fff;font-size:12px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.45);white-space:nowrap}
.bdg{position:absolute;top:-6px;right:-7px;min-width:23px;height:23px;padding:0 6px;border-radius:12px;background:#ff3b30;color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center}
.widget{grid-column:span 2;grid-row:span 2;width:calc(100% - 8px);aspect-ratio:1;border-radius:24px;padding:15px 16px;text-align:left;overflow:hidden;position:relative;transition:transform .15s}
.widget:active{transform:scale(.95)}
.wcal{background:#fff;color:#000;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.wcal .wd{color:#ff3b30;font-size:13px;font-weight:700}
.wcal .wn{font-size:46px;font-weight:300;line-height:1;margin:2px 0 8px}
.wcal .we{font-size:13px;font-weight:600;padding-left:7px;border-left:3px solid #af52de;margin-top:5px;line-height:1.25}
.wcal .we small{display:block;color:var(--grey);font-weight:400;font-size:12px}
.wwx{background:linear-gradient(180deg,#2f86e6,#58a8f0);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.wwx .c{font-size:15px;font-weight:600}
.wwx .tp{font-size:44px;font-weight:300;line-height:1.1}
.wwx .ds{position:absolute;left:16px;bottom:14px;font-size:13px;font-weight:600;line-height:1.35}
.wwx .ds small{display:block;font-weight:500}
.dock{position:absolute;bottom:14px;left:12px;right:12px;height:94px;border-radius:34px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);display:flex;justify-content:space-around;align-items:center;padding:0 6px}
.dock .lbl{display:none}
.pg{position:absolute;inset:0;background:#fff;overflow:hidden;will-change:transform}
.pg.grouped{background:var(--bg2)}
.pg.dark{background:#000;color:#fff}
.pg.pushed{box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.nav{position:absolute;z-index:6;top:0;left:0;right:0;height:98px;padding:54px 8px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;transition:background .25s,box-shadow .25s}
.pg.scrolled .nav,.nav.solid{background:rgba(249,249,249,.86);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nb-back{display:flex;align-items:center;gap:1px;color:var(--blue);font-size:17px;justify-self:start;height:44px;padding-right:8px;white-space:nowrap}
.nb-back svg{width:13px;height:21px;stroke:currentColor;margin-right:5px}
.nb-title{font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap}
.pg.scrolled .nb-title,.nav.solid .nb-title{opacity:1}
.nb-right{justify-self:end;display:flex;gap:18px;align-items:center;white-space:nowrap;color:var(--blue);font-size:17px;padding-right:8px}
.nb-right svg{stroke:currentColor;fill:none;width:24px;height:24px;stroke-width:1.7}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:98px;padding-bottom:110px;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.lt{font-size:34px;font-weight:700;letter-spacing:.3px;margin:2px 16px 8px;line-height:41px}
.tabbar{position:absolute;z-index:6;bottom:0;left:0;right:0;height:84px;padding:7px 0 30px;display:flex;background:rgba(249,249,249,.92);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);box-shadow:0 -.5px 0 var(--sep)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#999;font-size:10px;font-weight:500}
.tabbar svg{width:28px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabbar .on{color:var(--blue)}
.kk{background:#fff}
.kk-h{position:absolute;z-index:5;top:0;left:0;right:0;padding:58px 18px 8px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.kk-h b{font-size:22px;font-weight:700}
.kk-h span{display:flex;gap:18px}
.kk-h svg{width:24px;height:24px;stroke:#111;fill:none;stroke-width:1.7}
.kk .scroll{padding-top:104px}
.crow{display:flex;gap:12px;align-items:center;padding:8px 18px;width:100%;text-align:left}
.crow:active{background:#f3f3f3}
.av{width:48px;height:48px;border-radius:18px;flex:none;overflow:hidden;background:#a9c0d6;display:grid;place-items:center;font-size:20px;font-weight:600;color:#fff}
.crow .cn{font-size:15.5px;font-weight:600;display:flex;gap:5px;align-items:center}
.crow .cn small{color:#aaa;font-weight:500;font-size:14px}
.crow .cp{font-size:13.5px;color:#888;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cm{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;align-self:flex-start;padding-top:4px}
.crow .ct{font-size:11.5px;color:#aaa}
.kbdg{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#fa5a3c;color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.kk .tabbar{background:#fff;box-shadow:0 -.5px 0 #e5e5e5}
.kk .tabbar button{color:#b3b3b3}
.kk .tabbar .on{color:#111}
.chat{background:#b2c7d9;display:flex;flex-direction:column}
.chat-h{flex:none;height:100px;padding:54px 10px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#b2c7d9;position:relative;z-index:3}
.chat-h .bk{display:flex;align-items:center;gap:2px;font-size:16px;color:#111;height:40px;padding:0 6px}
.chat-h .bk svg{width:12px;height:20px;stroke:#111;fill:none;stroke-width:2.2}
.chat-h .nm{font-size:16.5px;font-weight:600;display:flex;gap:5px;align-items:center}
.chat-h .nm small{color:#555;font-weight:500}
.chat-h .rt{justify-self:end;display:flex;gap:16px;padding-right:6px}
.chat-h .rt svg{width:23px;height:23px;stroke:#111;fill:none;stroke-width:1.7}
.msgs{flex:1;overflow-y:auto;padding:4px 10px 14px;scrollbar-width:none;overscroll-behavior:contain}
.msgs::-webkit-scrollbar{display:none}
.ln{display:flex;align-items:flex-end;gap:5px;margin-top:4px}
.ln.me{flex-direction:row-reverse}
.ln.th{padding-left:47px}
.ln.th.first{padding-left:0;align-items:flex-start;margin-top:10px}
.ln .sav{width:40px;height:40px;border-radius:15px;overflow:hidden;flex:none;background:#a9c0d6;display:grid;place-items:center;font-size:16px;font-weight:600;color:#fff}
.ln .col{display:flex;flex-direction:column;max-width:72%;min-width:0}
.ln .who{font-size:12px;color:#4a4a4a;margin:1px 0 4px 2px}
.ln .wrap{display:flex;align-items:flex-end;gap:5px}
.bb{padding:8px 11px;border-radius:15px;font-size:15px;line-height:1.36;word-break:break-all;white-space:pre-wrap;position:relative;max-width:100%}
.th .bb{background:#fff}
.me .bb{background:#fee500}
.ln.th.first .bb{border-top-left-radius:4px}
.ln.me.first .bb{border-top-right-radius:4px}
.tm{font-size:10px;color:#556270;white-space:nowrap;flex:none;margin-bottom:1px;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.cin{flex:none;background:#fff;display:flex;align-items:center;gap:8px;padding:7px 10px 40px;min-height:52px}
.cin svg{width:26px;height:26px;stroke:#555;fill:none;stroke-width:1.6;flex:none}
.cin input{flex:1;min-height:38px;border:0;border-radius:19px;background:#f3f3f3;padding:9px 14px;font-size:15px;color:#111;outline:none;letter-spacing:-.2px}
.cin .snd{width:36px;height:36px;border-radius:12px;background:#fee500;display:grid;place-items:center;flex:none;transform:scale(0);transition:transform .25s var(--ease)}
.cin .snd.on{transform:scale(1)}
.cin .snd svg{width:18px;height:18px;stroke:#3a1d1d;stroke-width:2.4}
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;font-size:13px;font-weight:600;margin:10px 16px 14px}
.seg button{flex:1;padding:5px 14px;border-radius:7px;color:#000}
.seg .on{background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.1)}
.prow{display:flex;align-items:center;gap:10px;padding:0 0 0 16px;position:relative;min-height:62px;width:100%;text-align:left}
.prow:active{background:#e5e5ea}
.prow+.prow::before{content:'';position:absolute;top:0;left:44px;right:0;height:.5px;background:var(--sep)}
.prow .pi{width:18px;flex:none}
.prow .pi svg{width:15px;height:15px;fill:var(--grey)}
.prow.miss .pi svg{fill:var(--red)}
.prow .pn{flex:1;min-width:0}
.prow .pn b{display:block;font-size:17px;font-weight:600}
.prow.miss .pn b{color:var(--red)}
.prow .pn small{color:var(--grey);font-size:14px}
.prow .pd{color:var(--grey);font-size:15px}
.prow .inf{width:44px;display:grid;place-items:center}
.prow .inf svg{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:1.6}
.cal-head{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 8px}
.cal-head span{font-size:22px;font-weight:700}
.cal-head button{width:36px;height:36px;border-radius:50%;color:var(--blue);font-size:24px;font-weight:300;display:grid;place-items:center}
.cal-head button:active{background:#efeff4}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-w{font-size:12px;color:var(--grey);font-weight:500;padding:4px 0 6px;border-bottom:.5px solid var(--sep);margin:0 16px}
.cal-d{height:54px;padding-top:7px;font-size:19px;display:flex;flex-direction:column;align-items:center;border-top:.5px solid #eee}
.cal-d span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.cal-d.td span{color:var(--red);font-weight:600}
.cal-d.sel span{background:#000;color:#fff;font-weight:600}
.cal-d.sel.td span{background:var(--red);color:#fff}
.cal-d.empty{visibility:hidden}
.cal-d i{width:5px;height:5px;border-radius:50%;background:#c7c7cc;margin-top:3px}
.cal-d.has i{background:var(--blue)}
.evt{display:flex;gap:10px;padding:11px 16px;font-size:16px;align-items:center}
.evt .bar{width:4px;align-self:stretch;border-radius:2px;background:#af52de}
.evt b{flex:1;font-weight:500}
.evt small{color:var(--grey);font-size:14px}
.evt .del{color:var(--red);font-size:13px;padding:4px 8px;background:#fff0ef;border-radius:8px}
.ptabs{display:flex;gap:8px;padding:8px 16px 12px;background:rgba(249,249,249,.94);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-bottom:.5px solid var(--sep)}
.ptabs button{flex:1;padding:8px;border-radius:10px;background:rgba(118,118,128,.12);font-size:14px;font-weight:600;color:#000}
.ptabs button.on{background:var(--blue);color:#fff}
.ph-g{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.pcell{position:relative;aspect-ratio:1;overflow:hidden;background:#e5e5ea;display:block;border:0;padding:0;cursor:pointer}
.pcell img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:2}
.pcell .fb{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font-size:30px;color:#8e8e93;background:linear-gradient(135deg,#f2f2f7,#e0e0e5)}
.music{background:linear-gradient(180deg,#3a2e36 0%,#1c1820 60%,#0d0b10 100%);color:#fff}
.music .nav{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;color:#fff}
.music .nb-back{color:#fff}
.mb{padding:10px 32px 20px;display:flex;flex-direction:column;align-items:center}
.mcover{width:100%;aspect-ratio:1;max-width:240px;border-radius:12px;background:linear-gradient(145deg,#ff6b81,#ff2d55 45%,#8e2de2);background-size:cover;background-position:center;display:grid;place-items:center;font-size:70px;box-shadow:0 24px 60px rgba(0,0,0,.5);transition:transform .45s var(--ease)}
.mcover.paused{transform:scale(.88)}
.minfo{align-self:stretch;margin-top:24px}
.mtitle{font-size:22px;font-weight:700}
.martist{font-size:20px;color:rgba(255,255,255,.62);margin-top:1px}
.mprog{align-self:stretch;margin-top:22px}
.mbar{height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.mbar i{display:block;height:100%;width:0%;border-radius:3px;background:rgba(255,255,255,.88);transition:width .2s linear}
.mtimes{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.55);margin-top:6px;font-variant-numeric:tabular-nums}
.mctl{display:flex;align-items:center;gap:52px;margin-top:20px}
.mctl button{display:grid;place-items:center;transition:transform .15s}
.mctl button:active{transform:scale(.88)}
.mctl svg{fill:#fff}
.mplay{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.14)}
.mplay svg{width:30px;height:30px}
.slist{padding:8px 16px 0;border-top:.5px solid rgba(255,255,255,.1);margin-top:10px}

/* ==========================================================

let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', initAudio, { once: true });

function playTone(freq, type, duration, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const SFX = {
  tap: () => { playTone(800, 'sine', 0.05, 0.05); if (navigator.vibrate) navigator.vibrate(10); },

      // 周六：约会（罗渽民）
      if (wd === 6) {
        evs[dateStr].push({ title: "约会（渽民）", time: "19:00", color: "#af52de" });
      }
    }

    // C. 对当天的日程按时间排序
    if (evs[dateStr].length > 0) {
      evs[dateStr].sort((a, b) => {
        if (a.time === '凌晨') return -1;
        if (b.time === '凌晨') return 1;
        if (a.time === '全天') return -1;
        if (b.time === '全天') return 1;
        return a.time.localeCompare(b.time);
      });
    }

    dateLoop.setDate(dateLoop.getDate() + 1);
  }
  
  return evs;
}  
function defaultData() {
  const d = {
    ownerName: CONFIG.ownerName,
    contacts: clone(CONFIG.contacts),
    calls: clone(CONFIG.calls),
    events: buildDefaultEvents(),
    photos: clone(CONFIG.photos),
    notes: clone(CONFIG.notes),
    safariHistory: clone(CONFIG.safariHistory),
    insLikes: {},
    scriptProgress: {},
    scriptVersion: 2
  };
  trimLastBlock(d);
  return d;
}

/* 删掉每个角色 2026-10-22 及之后的消息，交给剧本接管 */
function trimLastBlock(d) {
  if (!Array.isArray(d.contacts)) return;
  d.contacts.forEach(c => {
    c.messages = (c.messages || []).filter(m => {
      const t = String(m.time || '');
      const mt = t.match(/^(\d{4}-\d{2}-\d{2})/);
      return !mt || mt[1] < '2026-10-22';
    });
  });
}function loadData() {
  let d = null;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) d = JSON.parse(raw);
  } catch (e) { d = null; }
  if (!d || typeof d !== 'object') d = defaultData();
  if (!Array.isArray(d.contacts)) d.contacts = clone(CONFIG.contacts);
  if (!Array.isArray(d.calls)) d.calls = clone(CONFIG.calls);
  if (!d.events || typeof d.events !== 'object') d.events = buildDefaultEvents();
  if (!Array.isArray(d.photos)) d.photos = clone(CONFIG.photos);
  /* 旧缓存没有 time，按序号补一个，保证能分组 */
  if (Array.isArray(d.photos)) {
    d.photos.forEach((p, i) => {
      if (!p.time) {
        const base = new Date();
        base.setDate(base.getDate() - Math.floor(i / 2));
        p.time = fmtDate(base) + ' ' + pad(10 + (i % 8)) + ':' + pad((i * 7) % 60);
      }
    });
  }
    if (!Array.isArray(d.notes)) d.notes = clone(CONFIG.notes);   /* 兼容旧数据 */
   // 如果没数据或数据为空，强制读取后台配置
  if (!Array.isArray(d.safariHistory) || d.safariHistory.length === 0) {
    d.safariHistory = clone(CONFIG.safariHistory);
  }
  if (!d.insLikes || typeof d.insLikes !== 'object') d.insLikes = {};
  if (!d.ownerName) d.ownerName = CONFIG.ownerName;
  /* 剧本系统迁移：旧缓存裁掉最后一段 */
if (!d.scriptVersion || d.scriptVersion < 2) {
  trimLastBlock(d);
  d.scriptProgress = {};
  d.scriptVersion = 2;
}
if (!d.scriptProgress || typeof d.scriptProgress !== 'object') d.scriptProgress = {};return d;
}

function relRect(el) {
  const s = SCREEN.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: (r.left - s.left) / SC, y: (r.top - s.top) / SC, w: r.width / SC, h: r.height / SC };
}

function devRadius() {
  return $('#phone').classList.contains('mob') ? 0 : 58;
}

function zoomFrames(r) {
  const W = SCREEN.clientWidth;
  const H = SCREEN.clientHeight;
  const s = r.w / W;
  const iy = Math.max(0, (H - r.h / s) / 2);
  const dx = r.x + r.w / 2 - W / 2;
  const dy = r.y + r.h / 2 - H / 2;
  return [
    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')',
      clipPath: 'inset(' + iy + 'px 0px round ' + (15 / s) + 'px)', opacity: .25 },
    { transform: 'translate(0px,0px) scale(1)',
      clipPath: 'inset(0px 0px round ' + devRadius() + 'px)', opacity: 1 }
  ];
}

function wireScroll(pg) {
  const sc = pg.querySelector('.scroll');
  if (sc) sc.addEventListener('scroll', () => pg.classList.toggle('scrolled', sc.scrollTop > 38), { passive: true });
}

function show(id, anim) {
  anim = anim || 'swap';
  const old = Array.from(APP.children);
  old.forEach(o => o.querySelectorAll('video').forEach(v => v.pause()));
  
  try {
    view = id;
    const v = VIEWS[id]();
    const pg = document.createElement('div');
    pg.className = 'pg ' + (v.cls || '');
    pg.innerHTML = v.html;
    pg.dataset.view = id;
    pg.dataset.dark = v.dark ? '1' : '';
    APP.appendChild(pg);
    setStatus(v.dark);
    wireScroll(pg);
    
    // 立即隐藏旧页面，防止因为报错导致旧页面挡住点击
    old.forEach(o => { 
      o.style.pointerEvents = 'none'; 
      o.style.visibility = 'hidden'; 
    });
    
    const done = () => old.forEach(o => o.remove());
    if (anim === 'push') {
      pg.classList.add('pushed');
      pg.animate([{ transform: 'translateX(100%)' }, { transform: 'none' }],
        { duration: 460, easing: 'cubic-bezier(.32,.72,0,1)' });
      old.forEach(o => o.animate(
        [{ transform: 'none', filter: 'brightness(1)' }, { transform: 'translateX(-28%)', filter: 'brightness(.92)' }],
        { duration: 460, easing: 'cubic-bezier(.32,.72,0,1)' }));
      setTimeout(done, 460);
    } else if (anim === 'pop') {
      pg.animate(
        [{ transform: 'translateX(-28%)', filter: 'brightness(.92)' }, { transform: 'none', filter: 'brightness(1)' }],
        { duration: 460, easing: 'cubic-bezier(.32,.72,0,1)' });
      old.forEach(o => {
        o.classList.add('pushed');
        o.animate([{ transform: 'none' }, { transform: 'translateX(100%)' }],
          { duration: 460, easing: 'cubic-bezier(.32,.72,0,1)', fill: 'forwards' });
      });
      setTimeout(done, 460);
    } else {
      done();
    }
    if (v.init) v.init(pg);
    updateCrumb();
    if (view !== 'chat') scheduleBackgroundScripts();
    return pg;
  } catch (err) {
    console.error('渲染页面出错:', err);
    old.forEach(o => o.remove());
    toast('页面加载失败');
    closeApp(); // 强制返回桌面
  }
}/* ==========================================================
   剧本推进器（后台自动发消息 + 弹窗）
   ========================================================== */
let scriptTimers = {};   /* name -> timerId */
let scriptRunning = {};  /* name -> bool，正在输入中 */

function clearScriptTimer(name) {
  if (scriptTimers[name]) {
    clearTimeout(scriptTimers[name]);
    delete scriptTimers[name];
  }
}

/* 发一条角色消息（根据上下文决定：刷新聊天 / 弹通知） */
function emitScriptLine(name) {
  if (scriptRunning[name]) return;

  const idx = state.data.contacts.findIndex(c => c.name === name);
  if (idx < 0) return;
  const c = state.data.contacts[idx];
  const script = (CONFIG.scripts && CONFIG.scripts[name]) || [];
  const prog = (state.data.scriptProgress && state.data.scriptProgress[name]) || 0;
  const node = script[prog];
  if (!node || node.from !== 'other') return;

  scriptRunning[name] = true;
  const inChat = view === 'chat' &&
    state.data.contacts[chatId] && state.data.contacts[chatId].name === name;

  /* 聊天页内先显示"正在输入..." */
  if (inChat) {
    const msgsEl = document.getElementById('msgs');
    if (msgsEl) {
      const ti = document.createElement('div');
      ti.className = 'ln th first';
      ti.id = 'typing-indicator';
      ti.innerHTML =
        '<div class="sav" style="background:' + (c.color || '#a9c0d6') + '">…</div>' +
        '<div class="col"><div class="wrap"><div class="bb" style="padding:12px 13px">' +
        '<span style="color:#888;font-size:13px;">正在输入...</span></div></div></div></div>';
      msgsEl.appendChild(ti);
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }
  }

  const wait = inChat ? 900 : 400;   /* 在聊天页里等久一点，制造输入感 */

  setTimeout(() => {
    scriptRunning[name] = false;
    const ti = document.getElementById('typing-indicator');
    if (ti) ti.remove();

    const d = new Date();
    c.messages.push({
      me: false,
      text: node.text,
      time: '今天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes())
    });
    state.data.scriptProgress[name] = prog + 1;
    saveData();

    const stillInChat = view === 'chat' &&
      state.data.contacts[chatId] && state.data.contacts[chatId].name === name;

    if (stillInChat) {
      show('chat', 'none');
    } else {
      /* ★ 不在这个聊天 → 弹窗 + 红点 */
      triggerNotification(idx, node.text, null);
    }

    /* 如果下一条还是对方，继续推进 */
    const nextProg = prog + 1;
    const nextNode = script[nextProg];
    if (nextNode && nextNode.from === 'other') {
      const delay = stillInChat
        ? 1400                                  /* 在聊天页里：连发节奏 */
        : (10000 + Math.random() * 10000);      /* 后台：10~20 秒后下一条 */
      clearScriptTimer(name);
      scriptTimers[name] = setTimeout(() => {
        delete scriptTimers[name];
        emitScriptLine(name);
      }, delay);
    }
  }, wait);
}

/* 切到非聊天页时，为所有"停在角色发言节点"的角色安排后台定时器 */
function scheduleBackgroundScripts() {
  if (!CONFIG.scripts) return;
  state.data.contacts.forEach((c, i) => {
    const script = CONFIG.scripts[c.name];
    if (!script) return;
    if (scriptTimers[c.name] || scriptRunning[c.name]) return;

    const prog = (state.data.scriptProgress && state.data.scriptProgress[c.name]) || 0;
    const node = script[prog];
    if (!node || node.from !== 'other') return;   /* 等主控选项时不动 */

    /* 每个角色错开时间，避免 4 个人同时弹 */
    const delay = 18000 + i * 9000 + Math.random() * 6000;
    scriptTimers[c.name] = setTimeout(() => {
      delete scriptTimers[c.name];
      emitScriptLine(c.name);
    }, delay);
  });

    { duration: 400, easing: 'ease-in' }).onfinish = () => {

  };
}

    { duration: 460, easing: 'cubic-bezier(.2,.9,.22,1)' });

/* ---- 聊天室（含跨天日期分隔） ---- */
function msgDateKey(m) {
  const s = (m && m.time) ? String(m.time) : '';
  if (!s) return null;
  const shift = n => { const d = new Date(); d.setDate(d.getDate() - n); return fmtDate(d); };
  if (s.indexOf('今天') >= 0) return shift(0);
  if (s.indexOf('昨天') >= 0) return shift(1);
  if (s.indexOf('前天') >= 0) return shift(2);
  const mt = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (mt) return mt[1] + '-' + pad(+mt[2]) + '-' + pad(+mt[3]);
  return null;
}

function chatDateLabel(key) {
  if (!key) return '';
  const today = fmtDate(new Date());
  const y = new Date(); y.setDate(y.getDate() - 1);
  const q = new Date(); q.setDate(q.getDate() - 2);
  if (key === today) return '今天';
  if (key === fmtDate(y)) return '昨天';
  if (key === fmtDate(q)) return '前天';
  const p = key.split('-').map(Number);
  if (p.length === 3 && !isNaN(p[0])) return p[0] + '年' + p[1] + '月' + p[2] + '日';
  return key;
}

VIEWS.chat = () => {
  const c = state.data.contacts[chatId];
  if (!c) return { cls: 'chat', html: '<div class="chat-h"></div>' };
  const msgs = c.messages || [];
  const isGroup = !!c.group;
  let body = '';
  let lastDateKey = null;

  msgs.forEach((m, i) => {
    const dk = msgDateKey(m);
    if (dk && dk !== lastDateKey) {
      body += '<div class="chat-date"><span>' + esc(chatDateLabel(dk)) + '</span></div>';
      lastDateKey = dk;
    }
    const prev = msgs[i - 1];
    const key = (m.me ? 'me:' : 'other:') + (m.sender || '');
    const prevKey = prev ? ((prev.me ? 'me:' : 'other:') + (prev.sender || '')) : null;
    const first = !prev || prevKey !== key;
    const last = i === msgs.length - 1;
    const name = m.me ? '我' : (m.sender || c.name);
    const avatarText = m.me ? '' : (m.sender ? m.sender.charAt(0) : (c.avatar || c.name.charAt(0)));
    const avatarColor = m.me ? c.color : (m.sender ? senderColor(m.sender) : (c.color || '#a9c0d6'));
    const av = (!m.me && first)
      ? '<div class="sav" style="background:' + avatarColor + '">' + esc(avatarText) + '</div>' : '';

    const tm = (last && m.time) ? '<div class="tm"><span>' + esc(m.time) + '</span></div>' : '';

    let bubbleHTML = '';
    if (m.recall) {
      bubbleHTML = '<div class="bb-recall">' + esc(m.text || '你撤回了一条消息') + '</div>';
    } else if (m.img) {
      bubbleHTML = '<div class="bb bb-img"><img src="' + esc(m.img) + '" onclick="viewImg(\'' + esc(m.img) + '\')"></div>';
    } else if (m.voice) {

    } else if (m.transfer) {
      bubbleHTML = '<div class="bb bb-transfer"><div>💸 ' + esc(m.transfer.title || '转账') + '</div>' +
        '<span>' + esc(m.transfer.amount) + ' 元</span></div>';
    } else {
      bubbleHTML = '<div class="bb">' + esc(m.text) + '</div>';
    }

    body += '<div class="ln ' + (m.me ? 'me' : 'th') + ' ' + (first ? 'first' : '') + '">' +
      av + '<div class="col">' + who +
        '<div class="wrap">' + (m.me ? tm : '') + bubbleHTML + (m.me ? '' : tm) + '</div>' +
      '</div></div>';
  });

  /* ---- 底部：剧本选项 / 等待 / 结束 ---- */
  const script = (CONFIG.scripts && CONFIG.scripts[c.name]) || [];
  const prog = (state.data.scriptProgress && state.data.scriptProgress[c.name]) || 0;
  const node = script[prog];

  let bottom = '';
  if (node && node.from === 'me') {
    bottom = '<div class="choices">' +
      node.options.map((o, i) =>
        '<button onclick="pickOption(' + i + ')">' + esc(o) + '</button>'
      ).join('') +
    '</div>';
  } else if (prog >= script.length) {
    bottom =
      '<div class="script-wait">剧本结束 · 想说什么就说什么（不会有人回复）</div>' +
      '<div class="cin">' + G.plusSq +
        '<input id="chatInput" type="text" placeholder="输入消息" autocomplete="off">' +
        '<button class="snd" id="sendBtn">' + G.arrowUp + '</button>' +
      '</div>';
  } else {
    bottom = '<div class="script-wait">对方正在输入…</div>';
  }

  return {
    cls: 'chat',
    html:
      '<div class="chat-h">' +
        '<button class="bk" onclick="back()">' + G.chevL + '</button>' +
        '<div class="nm">' + esc(c.name) +
          (isGroup ? '<small>' + (new Set(msgs.filter(x => x.sender).map(x => x.sender)).size + 1) + '</small>' : '') +
        '</div>' +

      if (cc) unreadData[cc.name] = 0;
      if (view === 'home') renderHome();

      const msgsEl = pg.querySelector('#msgs');

      if (inp) {
        inp.addEventListener('input', () => {
          if (snd) snd.classList.toggle('on', inp.value.trim().length > 0);
        });
        inp.addEventListener('keydown', e => {

        });

      if (snd) snd.addEventListener('click', sendMsg);

      /* 进入聊天：取消该角色的后台定时器，立即推进 */

function pickOption(i) {

  const text = node.options[i];

  });

function hexToRgba(hex, alpha) {
  if (!hex) hex = '#af52de';
  let r = 0, g = 0, b = 0;
  if (hex.length === 4) {
    r = parseInt(hex[1] + hex[1], 16);
    g = parseInt(hex[2] + hex[2], 16);
    b = parseInt(hex[3] + hex[3], 16);
  } else if (hex.length === 7) {
    r = parseInt(hex.substring(1, 3), 16);
    g = parseInt(hex.substring(3, 5), 16);
    b = parseInt(hex.substring(5, 7), 16);
  }
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function calSelect(dateStr) {
  calSelDate = dateStr;
  show('calendar', 'none');

function calNav(d) {
  calMonth += d;
  if (calMonth > 12) { calMonth = 1; calYear++; }
  if (calMonth < 1) { calMonth = 12; calYear--; }
  show('calendar', 'none');
}

function delEvent(i) {

/* ---- 按时间分组 ---- */
function photoTimeMs(p) {
  const s = p && p.time;
  if (!s) return 0;
  const t = new Date(String(s).replace(/-/g, '/')).getTime();
  return isNaN(t) ? 0 : t;
}

function groupPhotosByDate(list) {
  const map = new Map();
  list.forEach(p => {
    const key = String((p && p.time) || '').slice(0, 10) || '未知日期';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(p);
  });
  const keys = Array.from(map.keys())
    .filter(k => k !== '未知日期')
    .sort((a, b) => b.localeCompare(a));      /* 日期倒序：最新在最上 */
  if (map.has('未知日期')) keys.push('未知日期');
  return keys.map(k => ({
    key: k,
    items: map.get(k).sort((a, b) => photoTimeMs(b) - photoTimeMs(a))  /* 组内时间倒序 */
  }));
}

function photoDateLabel(key) {
  if (key === '未知日期') return '未知日期';
  const today = fmtDate(new Date());
  const y = new Date();
  y.setDate(y.getDate() - 1);
  if (key === today) return '今天';
  if (key === fmtDate(y)) return '昨天';
  const p = key.split('-').map(Number);
  if (p.length === 3 && !isNaN(p[0])) return p[0] + '年' + p[1] + '月' + p[2] + '日';
  return key;
}

function photoGridHTML() {
  if (photoTabPrivate && !privateUnlocked) {
    return '<div style="padding:60px 30px;text-align:center;color:var(--grey);font-size:15px;line-height:1.8">' +

      '<div style="font-size:44px">🖼️</div>还没有照片<br>把图片放到 photos 文件夹<br>再在 CONFIG.photos 里添加</div>';
  }

  let html = '';
  groupPhotosByDate(list).forEach(g => {
    html += '<div class="ph-date">' + esc(photoDateLabel(g.key)) + ' · ' + g.items.length + ' 张</div>';
    html += '<div class="ph-g">';
       g.items.forEach(p => {
      const realIdx = state.data.photos.indexOf(p);
      html += '<button class="pcell" onclick="openViewer(' + realIdx + ')">' +

  return html;
}

let musicPos = 0;
let musicTotal = 180;
let musicTimer = null;
let usingRealAudio = false;

function isCoverUrl(c) {
  if (!c) return false;
  return /^(https?:|data:image|\/|\.\/|photos\/|music\/)/.test(c) ||
    /\.(jpg|jpeg|png|gif|webp|svg|avif)$/i.test(c);
}

    else if (s.cover) coverInner = s.cover;
  }

  let listHTML = '';

  }

  const total = usingRealAudio && PLAYER.duration ? PLAYER.duration : musicTotal;
  const pos = usingRealAudio ? PLAYER.currentTime : musicPos;
  const pct = total > 0 ? Math.min(100, pos / total * 100) : 0;

  return {

    dark: true,
    html:
      '<div class="nav solid" style="background:transparent;box-shadow:none">' +
        '<button class="nb-back" onclick="closeApp()">' + G.chevL + '资料库</button>' +

      '</div>' +

          '<div class="minfo">' +
            '<div class="mtitle" id="mtitle">' + (s ? esc(s.title) : '还没有歌曲') + '</div>' +
            '<div class="martist" id="martist">' + (s ? esc(s.artist) : '在 CONFIG.songs 添加') + '</div>' +
          '</div>' +
          '<div class="mprog">' +
            '<div class="mbar"><i id="mfill" style="width:' + pct + '%"></i></div>' +
            '<div class="mtimes">' +
              '<span id="mcur">' + fmtTime(pos) + '</span>' +
              '<span id="mleft">-' + fmtTime(Math.max(0, total - pos)) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="mctl">' +
            '<button onclick="prevSong()">' + G.bwdF.replace('<svg', '<svg width="34" height="34"') + '</button>' +
            '<button class="mplay" onclick="togglePlay()">' + (musicPlaying ? G.pauseF : G.playF) + '</button>' +
            '<button onclick="nextSong()">' + G.fwdF.replace('<svg', '<svg width="34" height="34"') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="slist">' + listHTML + '</div>' +
      '</div>'
  };
};

function updateMusicUI() {
  const f = $('#mfill');
  const c = $('#mcur');
  const l = $('#mleft');
  if (!f) return;
  const total = usingRealAudio && PLAYER.duration ? PLAYER.duration : musicTotal;
  const pos = usingRealAudio ? PLAYER.currentTime : musicPos;
  const pct = total > 0 ? Math.min(100, pos / total * 100) : 0;
  f.style.width = pct + '%';
  if (c) c.textContent = fmtTime(pos);
  if (l) l.textContent = '-' + fmtTime(Math.max(0, total - pos));
}

function startFakePlay(duration) {
  musicTotal = duration;
  musicPos = 0;
  usingRealAudio = false;
  clearInterval(musicTimer);
  musicTimer = setInterval(() => {
    if (!musicPlaying) return;
    musicPos++;
    if (musicPos >= musicTotal) { musicPos = 0; nextSong(); return; }
    updateMusicUI();
  }, 1000);
}

function pickSong(i) {
  if (i === curSongIdx) { togglePlay(); return; }
  playSong(i);
}

function playSong(i) {
  if (!CONFIG.songs.length) return;
  curSongIdx = i;
  const s = CONFIG.songs[i];
  clearInterval(musicTimer);
  PLAYER.pause();
  PLAYER.currentTime = 0;
  musicPos = 0;
  musicPlaying = true;
  usingRealAudio = false;
  if (s.src) {
    PLAYER.src = s.src;
    PLAYER.play().then(() => {
      usingRealAudio = true;
      musicTotal = PLAYER.duration || s.duration || 180;
      if (view === 'music') show('music', 'none');
    }).catch(() => {
      toast('音频加载失败，改为模拟');
      startFakePlay(s.duration || 180);
      if (view === 'music') show('music', 'none');
    });
  } else {
    startFakePlay(s.duration || 180);
  }
  if (view === 'music') show('music', 'none');
}

function togglePlay() {
  if (!CONFIG.songs.length) return;
  const s = CONFIG.songs[curSongIdx];
  if (musicPlaying) {
    musicPlaying = false;
    if (usingRealAudio) PLAYER.pause();
    clearInterval(musicTimer);
  } else {
    musicPlaying = true;
    if (usingRealAudio) {
      PLAYER.play().catch(() => startFakePlay(s.duration || 180));
    } else {
      startFakePlay(musicTotal);
    }
  }
  if (view === 'music') show('music', 'none');
}

function nextSong() {
  if (!CONFIG.songs.length) return;
  playSong((curSongIdx + 1) % CONFIG.songs.length);
}

function prevSong() {
  if (!CONFIG.songs.length) return;
  playSong((curSongIdx - 1 + CONFIG.songs.length) % CONFIG.songs.length);
}

PLAYER.addEventListener('timeupdate', () => {
  if (usingRealAudio && view === 'music') updateMusicUI();
});
PLAYER.addEventListener('ended', () => { nextSong(); });

/* ---- Safari（带搜索记录） ---- */
let safariMode = 'home';   // 'home' 搜索记录页 | 'result' 结果页
let safariEditMode = false;
let safariQuery = '';

function safariStamp() {
  const d = new Date();
  return '今天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function safariPushHistory(q) {
  q = String(q || '').trim();
  if (!q) return;
  if (!Array.isArray(state.data.safariHistory)) state.data.safariHistory = [];
  const hist = state.data.safariHistory;
  /* 同一个词只保留最新一条 */
  const idx = hist.findIndex(h => h && h.q === q);
  if (idx >= 0) hist.splice(idx, 1);
  hist.unshift({ q: q, time: safariStamp() });
  if (hist.length > 30) hist.length = 30;   // 最多存 30 条
  saveData();
}

function safariSearch(q) {
  q = String(q || '').trim();
  if (!q) { toast('请输入搜索内容'); return; }
  safariPushHistory(q);
  safariQuery = q;
  safariMode = 'result';
  show('safari', 'none');
}

function safariSearchByIndex(i) {
  const hist = state.data.safariHistory || [];
  const h = hist[i];
  if (h) safariSearch(h.q);
}

function safariBackHome() {
  safariMode = 'home';
  safariQuery = '';
  show('safari', 'none');
}

function safariDelHistory(i) {
  const hist = state.data.safariHistory || [];
  if (!hist[i]) return;
  hist.splice(i, 1);
  saveData();
  show('safari', 'none');
  toast('已删除记录');
}

function safariClearHistory() {
  if (!(state.data.safariHistory || []).length) { toast('没有搜索记录'); return; }
  if (!confirm('清空全部搜索记录？')) return;
  state.data.safariHistory = [];
  saveData();
  show('safari', 'none');
  toast('已清空搜索记录');
}
function toggleSafariEdit() {
  safariEditMode = !safariEditMode;
  show('safari', 'none');
}

function saveSafariHistory(i, val) {
  const hist = state.data.safariHistory || [];
  if (!hist[i]) return;
  const newVal = String(val || '').trim();
  if (newVal && newVal !== hist[i].q) {
    hist[i].q = newVal;
    saveData();
    show('safari', 'none');
    toast('已修改');
  } else if (!newVal) {
    show('safari', 'none');
  }
}
/* 玩具版搜索结果 */
function safariResultsHTML(q) {
  const fake = [
    { t: q + ' - 维基百科', u: 'zh.wikipedia.org › wiki › ' + q,

/* 搜索框（主页 / 结果页共用） */
function safariBoxHTML(value) {
  return '<div class="sf-search-wrap">' +
    '<div class="sf-search">' + G.search +
      '<input id="safariSearch" type="text" placeholder="搜索或输入网站名称" autocomplete="off" value="' + esc(value || '') + '">' +
      '<button class="clr" id="sfClr">✕</button>' +
    '</div>' +
  '</div>';
}

function safariInit(pg) {
  const inp = pg.querySelector('#safariSearch');
  if (!inp) return;
  const clr = pg.querySelector('#sfClr');
  const upd = () => { if (clr) clr.style.display = inp.value ? 'block' : 'none'; };
  upd();
  inp.addEventListener('input', upd);
  if (clr) clr.addEventListener('click', e => {
    e.preventDefault();
    inp.value = '';
    upd();
    inp.focus();
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      inp.blur();
      safariSearch(inp.value);
    }
  });
}

};

/* ---- 备忘录列表 ---- */
let curNoteIdx = -1;

VIEWS.notes = () => {
  const list = state.data.notes || [];
  let rows = '';
  if (!list.length) {
    rows = '<div class="note-empty">还没有备忘录<br>点右上角 + 新建一条</div>';
  } else {
    list.forEach((n, i) => {
      const preview = String(n.body || '').replace(/\n/g, ' ').slice(0, 46);
      rows += '<button class="srow" onclick="openNote(' + i + ')">' +
        '<span style="flex:1;min-width:0;text-align:left">' +
          '<b style="display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
            esc(n.title || '无标题') +
          '</b>' +
          '<span style="display:block;font-size:13px;color:#8e8e93;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
            esc(preview || '没有正文') +
          '</span>' +
        '</span>' +
        '<span style="font-size:13px;color:#c7c7cc;flex:none;padding-left:8px">' + esc(n.time || '') + '</span>' +
        '<span style="color:#c7c7cc;flex:none;padding:0 4px 0 8px;font-size:18px">›</span>' +
      '</button>';
    });
  }
  return {
    cls: 'grouped',
    html:
      '<div class="nav"><span></span><div class="nb-title">备忘录</div>' +
        '<div class="nb-right"><button onclick="newNote()">' + G.plus + '</button></div></div>' +
      '<div class="scroll" style="padding-top:98px">' +
        '<h1 class="lt">备忘录</h1>' +
        '<div class="sgrp">' +
          '<div class="stitle-g">全部备忘录 · ' + list.length + ' 条</div>' +
          '<div class="scard">' + rows + '</div>' +
           '</div>' +
              '</div>'
  };
};

function newNote() {
  const n = { id: Date.now(), title: '', body: '', time: '刚刚' };
  if (!Array.isArray(state.data.notes)) state.data.notes = [];
  state.data.notes.unshift(n);
  saveData();
  curNoteIdx = 0;
  show('note', 'push');
  setTimeout(() => {
    const t = $('#noteTitle');
    if (t) t.focus();
  }, 480);
}

function openNote(i) {
  curNoteIdx = i;
  show('note', 'push');
}

function delNote() {
  if (curNoteIdx < 0) return;
  if (!confirm('删除这条备忘录？')) return;
  state.data.notes.splice(curNoteIdx, 1);
  saveData();
  back();
  toast('已删除');
}

/* ---- 备忘录编辑（新增） ---- */
VIEWS.note = () => {
  const n = (state.data.notes || [])[curNoteIdx];
  if (!n) {
    return {
      cls: 'grouped',
      html: '<div class="nav"><button class="nb-back" onclick="back()">' + G.chevL + '备忘录</button>' +
        '<div class="nb-title" style="opacity:1">备忘录</div><span></span></div>' +
        '<div class="note-empty">这条备忘录不存在</div>'
    };
  }
  return {
    html:
      '<div class="nav solid" style="background:#fff">' +
        '<button class="nb-back" onclick="back()">' + G.chevL + '备忘录</button>' +
        '<div class="nb-title" style="opacity:1">编辑</div>' +
        '<div class="nb-right"><button onclick="delNote()" style="color:var(--red)">' + G.trash + '</button></div>' +
      '</div>' +
      '<div class="scroll" style="padding-top:98px;padding-bottom:20px;background:#fff">' +
        '<input class="note-title" id="noteTitle" type="text" placeholder="标题" value="' + esc(n.title || '') + '">' +
        '<div class="note-sep"></div>' +
        '<textarea class="note-body" id="noteBody" placeholder="开始输入…">' + esc(n.body || '') + '</textarea>' +
      '</div>',
    init: pg => {
      const note = state.data.notes[curNoteIdx];
      if (!note) return;
      const t = pg.querySelector('#noteTitle');
      const b = pg.querySelector('#noteBody');
      const save = () => {
        note.title = t.value;
        note.body = b.value;
        const d = new Date();
        note.time = '今天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        saveData();
      };
      t.addEventListener('input', save);
      b.addEventListener('input', save);
      b.addEventListener('blur', save);
      t.addEventListener('blur', save);
            }
      };
};
/* ==========================================================
   ⑨ 通话
   ========================================================== */
function callBtnHTML(label, icon, cls) {
  return '<button class="cbtn"><span class="cc ' + (cls || '') + '">' + icon + '</span>' + label + '</button>';
}

function renderCallGrid(active) {
  const grid = $('#callGrid');
  if (!grid) return;
  
  // 统一渲染 6 个按钮，不再区分是否接通
  grid.style.display = 'grid';
  grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
  grid.innerHTML =
    callBtnHTML('静音', G.muteF) +
    callBtnHTML('键盘', G.keypadF) +
    callBtnHTML('免提', G.speaker) +
    callBtnHTML('添加通话', G.plusF) +
    callBtnHTML('FaceTime', G.videoF) +
    '<button class="cbtn" onclick="hangup()"><span class="cc red" style="transform:rotate(135deg)">' +
      G.handset + '</span>挂断</button>';
      
  // 给除了挂断之外的其他 5 个按钮绑定切换效果（点亮成白底）
  Array.from(grid.querySelectorAll('.cbtn')).forEach(b => {
    if (!b.querySelector('.cc.red')) {
      b.addEventListener('click', () => b.classList.toggle('on'));
    }
  });
}
let callTimeout = null; // 控制接通的延迟

function startCall(name) {
  const c = state.data.contacts.find(x => x.name === name);
  $('#callName').textContent = name;
  $('#callAvatar').textContent = c ? (c.avatar || name.charAt(0)) : name.charAt(0);
  $('#callStatus').textContent = '正在呼叫…';
  $('#callCaption').style.display = 'none';
  renderCallGrid(false); // 响铃状态
  $('#callOv').classList.add('on');

  state.callSeconds = 0;
  clearInterval(state.callTimer);
  clearTimeout(callTimeout);
  
  if (typeof SFX !== 'undefined' && SFX.dial) SFX.dial(); // 播放拨号音

  const script = (CONFIG.callScripts && CONFIG.callScripts[name]) || [{who: name, text: "喂？"}];
  let scriptIdx = 0;

  // 1.6秒后自动接通
  callTimeout = setTimeout(() => {
    if (!$('#callOv').classList.contains('on')) return;
    
    if (typeof SFX !== 'undefined' && SFX.connect) SFX.connect(); // 播放接通音
    $('#callStatus').textContent = '00:00';
    $('#callCaption').style.display = 'block';
    renderCallGrid(true); // 接通状态

    let firstLine = script[0];
    $('#callCaption').innerHTML = '<small>' + esc(firstLine.who) + '</small>' + esc(firstLine.text);

    state.callTimer = setInterval(() => {
      state.callSeconds++;
      const s = state.callSeconds;
      $('#callStatus').textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60);
      
      if (s % 2 === 0 && scriptIdx < script.length - 1) {
        scriptIdx++;
        const line = script[scriptIdx];
        $('#callCaption').innerHTML = '<small>' + esc(line.who) + '</small>' + esc(line.text);
      }
    }, 1000);
  }, 1600);
}
function hangup() {
  clearTimeout(callTimeout);
  clearInterval(state.callTimer);
  if (typeof SFX !== 'undefined' && SFX.hangup) SFX.hangup(); // 挂断音效

  const active = $('#callOv').classList.contains('on');
  $('#callOv').classList.remove('on');
  if (!active) return;

  const name = $('#callName').textContent;
  const s = state.callSeconds;
  const now = new Date();
  
  // 存入通话记录
  state.data.calls.unshift({
    name: name,
    type: 'outgoing',
    time: '今天 ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
    duration: s > 0 ? Math.floor(s / 60) + '分' + (s % 60) + '秒' : '00:00'
  });
  saveData();
  
  toast('通话结束');
  
  if (view === 'phone') {
    show('phone', 'none'); // 刷新电话列表
  }
}/* ==========================================================
   ⑩ 清空
   ========================================================== */
function clearChats() {
  if (!confirm('确定清空所有聊天记录吗？')) return;
  state.data.contacts.forEach(c => { c.messages = []; });
  saveData();
  toast('聊天记录已清空');
}

function clearCalls() {
  if (!confirm('确定清空所有通话记录吗？')) return;
  state.data.calls = [];
  saveData();
  toast('通话记录已清空');
}

function clearEvents() {
  if (!confirm('确定清空所有日历日程吗？')) return;
  state.data.events = {};
  saveData();
  toast('日历日程已清空');
}

function resetAll() {
  if (!confirm('恢复默认数据？当前记录会丢失。')) return;
  state.data = defaultData();
  saveData();
  initCalendar();
  toast('已恢复默认数据');
  if (view === 'settings') show('settings', 'none');
}

/* ==========================================================
   ⑪ 启动
   ========================================================== */
function updateClock() {
  $('#sbt').textContent = clock12();
  const lk = $('#lkt');
  if (lk) lk.textContent = clock12();
}

function fit() {
  const ph = $('#phone');
  const mob = innerWidth <= 540;
  ph.classList.toggle('mob', mob);
  if (mob) {
    ph.style.width = innerWidth + 'px';
    ph.style.height = innerHeight + 'px';
    ph.style.transform = '';
    SC = 1;
  } else {
    ph.style.width = '393px';
    ph.style.height = '852px';
    SC = Math.min((innerHeight - 40) / 852, (innerWidth - 40) / 393, 1.1);
    ph.style.transform = 'scale(' + SC + ')';
  }
}

window.addEventListener('resize', fit);

document.addEventListener('pointerdown', (e) => {
  const btn = e.target.closest('button, .app, .crow, .prow');
  if (btn) SFX.tap();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hbAction();
});

$('#hb').addEventListener('click', hbAction);

$('#eventModal').addEventListener('click', e => {
  if (e.target.id === 'eventModal') closeEventModal();
});
$('#privatePinModal').addEventListener('click', e => {
  if (e.target.id === 'privatePinModal') closePrivateModal();
});
$('#privatePinInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPrivatePin();
});

/* 双击 Home 指示条锁屏 */
let hbTapCount = 0, hbTimer = null;
$('#hb').addEventListener('click', () => {
  hbTapCount++;
  clearTimeout(hbTimer);
  hbTimer = setTimeout(() => { hbTapCount = 0; }, 350);
  if (hbTapCount >= 2 && view === 'home') {
    hbTapCount = 0;
    lockScreen();
  }
});

/* ==========================================================
   全局推送机制
   ========================================================== */
function getTotalUnread() {
  return Object.values(unreadData).reduce((a, b) => a + b, 0);
}

function triggerNotification(contactIndex, text, senderName) {
  const c = state.data.contacts[contactIndex];
  if (!c) return;

  const title = c.group && senderName ? senderName + ' (' + c.name + ')' : c.name;
  const avatar = c.group && senderName ? senderName.charAt(0) : (c.avatar || c.name.charAt(0));
  const color = c.group && senderName ? senderColor(senderName) : (c.color || '#a9c0d6');

  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

  if (view === 'chat' && state.data.contacts[chatId] === c) {
    unreadData[c.name] = 0;
    show('chat', 'none');
    return;
  }

  unreadData[c.name] = (unreadData[c.name] || 0) + 1;

  if (view === 'home') renderHome();

  showBanner(title, text, color, avatar, () => {
    if (view === 'lock' || view === 'pin') return;
    chatId = contactIndex;
    unreadData[c.name] = 0;
    if (view === 'home') {
      openApp('chat', document.querySelector('.app[data-app="kakao"] .icon'));
    } else {
      show('chat', 'push');
    }
    if (view === 'home') renderHome();
  });
}

function showBanner(title, text, color, avatar, onClick) {
  const container = document.getElementById('bannerContainer');
  if (!container) return;

  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML =
    '<div class="ni" style="background:' + color + '">' + avatar + '</div>' +
    '<div class="nt">' +
      '<div class="nh"><span>' + title + '</span><small>现在</small></div>' +
      '<div class="nb">' + esc(text) + '</div>' +
    '</div>';

  banner.onclick = () => {
    banner.classList.add('hide');
    setTimeout(() => banner.remove(), 300);
    if (onClick) onClick();
  };

  container.appendChild(banner);

  setTimeout(() => {
    if (banner.parentNode) {
      banner.classList.add('hide');
      setTimeout(() => banner.remove(), 300);
    }
  }, 5000);
}

/* ==========================================================
   初始化
   ========================================================== */
fit();
initCalendar();
renderLock();
renderHome();
setStatus(true);
$('#wall').classList.add('dim');
setInterval(updateClock, 1000);
updateClock();

</script>
